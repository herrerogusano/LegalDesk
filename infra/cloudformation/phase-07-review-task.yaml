AWSTemplateFormatVersion: "2010-09-09"
Description: LegalDesk Phase 07 review-task Lambda tool and least-privilege role

Parameters:
  ReviewTaskTableName:
    Type: String
    Description: Existing Phase 02 DynamoDB table name used for review-task metadata
    MinLength: 3
    MaxLength: 255
  ReviewTaskTableArn:
    Type: String
    Description: Existing Phase 02 DynamoDB table ARN; used to scope Lambda access
    AllowedPattern: "^arn:[^:]+:dynamodb:[^:]+:[0-9]{12}:table/[A-Za-z0-9_.-]+$"
  ReviewTaskCodeBucket:
    Type: String
    Description: S3 bucket containing the versioned review-task Lambda zip
    AllowedPattern: "^[a-z0-9][a-z0-9.-]{1,61}[a-z0-9]$"
  ReviewTaskCodeKey:
    Type: String
    Description: S3 object key for the review-task Lambda zip artifact
    MinLength: 1
    MaxLength: 1024
  ReviewTaskCodeVersion:
    Type: String
    Description: Immutable S3 object version for the review-task Lambda artifact
    MinLength: 1
    MaxLength: 1024
  IDPM2MClientId:
    Type: String
    Default: ""
    AllowedPattern: "^$|^[A-Za-z0-9]+$"
    Description: Optional dedicated IDP client; empty preserves the human-only target.
  IDPReviewScope:
    Type: String
    Default: legaldesk-idp/review-create
    AllowedValues: [legaldesk-idp/review-create]
  IDPReviewTenantId:
    Type: String
    Default: ""
    AllowedPattern: "^$|^[A-Za-z0-9][A-Za-z0-9_-]{0,63}$"
  IDPReviewMatterIds:
    Type: String
    Default: ""
    AllowedPattern: "^$|^[A-Za-z0-9][A-Za-z0-9_.:@/-]{0,127}(,[A-Za-z0-9][A-Za-z0-9_.:@/-]{0,127})?$"
  IDPSourceBucketName:
    Type: String
    Default: ""
    AllowedPattern: "^$|^[a-z0-9][a-z0-9.-]{1,61}[a-z0-9]$"
  IDPArtifactBucketName:
    Type: String
    Default: ""
    AllowedPattern: "^$|^[a-z0-9][a-z0-9.-]{1,61}[a-z0-9]$"

Conditions:
  HasSecondIDPMatter: !Not
    - !Equals
      - !Ref IDPReviewMatterIds
      - !Select [0, !Split [",", !Ref IDPReviewMatterIds]]
  HasIDPReviewTarget: !And
    - !Not [!Equals [!Ref IDPM2MClientId, ""]]
    - !Not [!Equals [!Ref IDPReviewTenantId, ""]]
    - !Not [!Equals [!Ref IDPReviewMatterIds, ""]]
    - !Not [!Equals [!Ref IDPSourceBucketName, ""]]
    - !Not [!Equals [!Ref IDPArtifactBucketName, ""]]

Resources:
  ReviewTaskLogGroup:
    Type: AWS::Logs::LogGroup
    DeletionPolicy: Delete
    UpdateReplacePolicy: Delete
    Properties:
      LogGroupName: /aws/lambda/LegalDeskReviewTaskPhase07
      RetentionInDays: 14
      Tags:
        - Key: Project
          Value: LegalDesk
        - Key: Phase
          Value: "07"

  ReviewTaskExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      Description: Least-privilege role for the Phase 07 review-task Lambda
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: LegalDeskReviewTaskPhase07
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Sid: ReadReviewTaskForIdempotency
                Effect: Allow
                Action: dynamodb:GetItem
                Resource: !Ref ReviewTaskTableArn
              - Sid: CreateReviewTask
                Effect: Allow
                Action:
                  - dynamodb:PutItem
                  - dynamodb:Query
                  - dynamodb:UpdateItem
                Resource: !Ref ReviewTaskTableArn
              - !If
                - HasIDPReviewTarget
                - Sid: ReadCanonicalIDPDocuments
                  Effect: Allow
                  Action: s3:GetObject
                  Resource:
                    - !Sub
                      - "${BucketArn}/tenants/${TenantId}/matters/${MatterId}/documents/*/original.pdf"
                      - BucketArn: !Sub "arn:${AWS::Partition}:s3:::${IDPSourceBucketName}"
                        TenantId: !Ref IDPReviewTenantId
                        MatterId: !Select [0, !Split [",", !Ref IDPReviewMatterIds]]
                    - !Sub
                      - "${BucketArn}/tenants/${TenantId}/matters/${MatterId}/documents/*/original.txt"
                      - BucketArn: !Sub "arn:${AWS::Partition}:s3:::${IDPSourceBucketName}"
                        TenantId: !Ref IDPReviewTenantId
                        MatterId: !Select [0, !Split [",", !Ref IDPReviewMatterIds]]
                    - !Sub
                      - "${BucketArn}/idp-artifacts/tenant=${TenantId}/matter=${MatterId}/document=*/run=*/pages-*"
                      - BucketArn: !Sub "arn:${AWS::Partition}:s3:::${IDPArtifactBucketName}"
                        TenantId: !Ref IDPReviewTenantId
                        MatterId: !Select [0, !Split [",", !Ref IDPReviewMatterIds]]
                    - !If
                      - HasSecondIDPMatter
                      - !Sub
                        - "${BucketArn}/tenants/${TenantId}/matters/${MatterId}/documents/*/original.pdf"
                        - BucketArn: !Sub "arn:${AWS::Partition}:s3:::${IDPSourceBucketName}"
                          TenantId: !Ref IDPReviewTenantId
                          MatterId: !Select [1, !Split [",", !Ref IDPReviewMatterIds]]
                      - !Ref AWS::NoValue
                    - !If
                      - HasSecondIDPMatter
                      - !Sub
                        - "${BucketArn}/idp-artifacts/tenant=${TenantId}/matter=${MatterId}/document=*/run=*/pages-*"
                        - BucketArn: !Sub "arn:${AWS::Partition}:s3:::${IDPArtifactBucketName}"
                          TenantId: !Ref IDPReviewTenantId
                          MatterId: !Select [1, !Split [",", !Ref IDPReviewMatterIds]]
                      - !Ref AWS::NoValue
                    - !If
                      - HasSecondIDPMatter
                      - !Sub
                        - "${BucketArn}/tenants/${TenantId}/matters/${MatterId}/documents/*/original.txt"
                        - BucketArn: !Sub "arn:${AWS::Partition}:s3:::${IDPSourceBucketName}"
                          TenantId: !Ref IDPReviewTenantId
                          MatterId: !Select [1, !Split [",", !Ref IDPReviewMatterIds]]
                      - !Ref AWS::NoValue
                - !Ref AWS::NoValue
              - Sid: WriteScopedExecutionLogs
                Effect: Allow
                Action:
                  - logs:CreateLogStream
                  - logs:PutLogEvents
                Resource: !Sub ${ReviewTaskLogGroup.Arn}:*

  ReviewTaskFunction:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: LegalDeskReviewTaskPhase07
      Description: Creates an authorized, idempotent human review task
      Runtime: python3.12
      Handler: legaldesk.review_tasks.lambda_handler
      Architectures:
        - x86_64
      Role: !GetAtt ReviewTaskExecutionRole.Arn
      Code:
        S3Bucket: !Ref ReviewTaskCodeBucket
        S3Key: !Ref ReviewTaskCodeKey
        S3ObjectVersion: !Ref ReviewTaskCodeVersion
      MemorySize: 256
      Timeout: 10
      Environment:
        Variables:
          AWS_MAX_ATTEMPTS: "1"
          AWS_RETRY_MODE: standard
          REVIEW_TASK_TABLE_NAME: !Ref ReviewTaskTableName
          IDP_TABLE_NAME: !Ref ReviewTaskTableName
          LEGALDESK_SOURCE_BUCKET: !Ref IDPSourceBucketName
          LEGALDESK_IDP_ARTIFACT_BUCKET: !Ref IDPArtifactBucketName
          LEGALDESK_IDP_M2M_CLIENT_ID: !Ref IDPM2MClientId
          LEGALDESK_IDP_REVIEW_SCOPE: !Ref IDPReviewScope
          LEGALDESK_IDP_REVIEW_TENANT_ID: !Ref IDPReviewTenantId
          LEGALDESK_IDP_REVIEW_MATTER_IDS: !Ref IDPReviewMatterIds
          REVIEW_TASK_SCHEMA_VERSION: "2"
      Tags:
        - Key: Project
          Value: LegalDesk
        - Key: Phase
          Value: "07"

Outputs:
  ReviewTaskFunctionArn:
    Value: !GetAtt ReviewTaskFunction.Arn
  ReviewTaskFunctionName:
    Value: !Ref ReviewTaskFunction
  ReviewTaskExecutionRoleArn:
    Value: !GetAtt ReviewTaskExecutionRole.Arn
  ReviewTaskLogGroupName:
    Value: !Ref ReviewTaskLogGroup
