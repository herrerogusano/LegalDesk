AWSTemplateFormatVersion: "2010-09-09"
Description: LegalDesk Phase 08 AgentCore Gateway with review Lambda, metadata MCP and (Phase 15, optional) search-documents targets

Metadata:
  cfn-lint:
    config:
      # The Phase 15 search-documents parameters are deliberately empty while
      # EnableSearchDocuments is "false" (so existing stacks keep their
      # parameter set). cfn-lint validates those empty defaults against the
      # properties of resources that CloudFormation then never creates, as in
      # phase-01-harness.yaml.
      ignore_checks: [W1030, W1031]

Parameters:
  ExistingMetadataTableName:
    Type: String
    MinLength: 3
    MaxLength: 255
    Description: Existing Phase 02 table containing authorization and document metadata
  ExistingMetadataTableArn:
    Type: String
    AllowedPattern: "^arn:[^:]+:dynamodb:[^:]+:[0-9]{12}:table/[A-Za-z0-9_.-]+$"
  ReviewTaskFunctionArn:
    Type: String
    AllowedPattern: "^arn:(aws[a-zA-Z-]*)?:lambda:[a-z0-9-]+:[0-9]{12}:function:[A-Za-z0-9-_.-]+$"
  MetadataMcpCodeBucket:
    Type: String
    AllowedPattern: "^[a-z0-9][a-z0-9.-]{1,61}[a-z0-9]$"
  MetadataMcpCodeKey:
    Type: String
    MinLength: 1
    MaxLength: 1024
  MetadataMcpCodeVersion:
    Type: String
    MinLength: 1
    MaxLength: 1024
  InterceptorCodeBucket:
    Type: String
    AllowedPattern: "^[a-z0-9][a-z0-9.-]{1,61}[a-z0-9]$"
  InterceptorCodeKey:
    Type: String
    MinLength: 1
    MaxLength: 1024
  InterceptorCodeVersion:
    Type: String
    MinLength: 1
    MaxLength: 1024
  GatewayJwtDiscoveryUrl:
    Type: String
    AllowedPattern: "^.+/\\.well-known/openid-configuration$"
  GatewayJwtClientId:
    Type: String
    MinLength: 1
  GatewayJwtAdditionalClientId:
    Type: String
    Default: ""
    AllowedPattern: "^$|^[A-Za-z0-9]+$"
    Description: Optional public Cognito client; M2M client remains required
  GatewayJwtIDPClientId:
    Type: String
    Default: ""
    AllowedPattern: "^$|^[A-Za-z0-9]+$"
    Description: >-
      Optional dedicated Phase 14 IDP client. Leave empty to preserve the
      existing human-only Gateway authorization contract.
  GatewayJwtScope:
    Type: String
    MinLength: 1
  GatewayJwtIDPScope:
    Type: String
    Default: legaldesk-idp/review-create
    AllowedValues: [legaldesk-idp/review-create]
  IDPReviewTenantId:
    Type: String
    Default: ""
    AllowedPattern: "^$|^[A-Za-z0-9][A-Za-z0-9_-]{0,63}$"
  IDPReviewMatterIds:
    Type: String
    Default: ""
    AllowedPattern: "^$|^[A-Za-z0-9][A-Za-z0-9_.:@/-]{0,127}(,[A-Za-z0-9][A-Za-z0-9_.:@/-]{0,127})?$"
  IDPSourceBucketName:
    Type: String
    Default: ""
    AllowedPattern: "^$|^[a-z0-9][a-z0-9.-]{1,61}[a-z0-9]$"
  IDPArtifactBucketName:
    Type: String
    Default: ""
    AllowedPattern: "^$|^[a-z0-9][a-z0-9.-]{1,61}[a-z0-9]$"
  # Phase 15 (ADR-021): the grounded-search Lambda target. Everything below is
  # inert while EnableSearchDocuments is "false", so existing stacks keep their
  # current parameter set and change set.
  EnableSearchDocuments:
    Type: String
    Default: "false"
    AllowedValues: ["true", "false"]
  SearchDocumentsCodeBucket:
    Type: String
    Default: ""
    AllowedPattern: "^$|^[a-z0-9][a-z0-9.-]{1,61}[a-z0-9]$"
  SearchDocumentsCodeKey:
    Type: String
    Default: ""
    MaxLength: 1024
  SearchDocumentsCodeVersion:
    Type: String
    Default: ""
    MaxLength: 1024
  SearchTenantId:
    Type: String
    Default: ""
    AllowedPattern: "^$|^[A-Za-z0-9][A-Za-z0-9_-]{0,127}$"
    Description: Single tenant whose source documents the search Lambda may HEAD
  SourceBucketArn:
    Type: String
    Default: ""
    AllowedPattern: "^$|^arn:[^:]+:s3:::[a-z0-9][a-z0-9.-]{1,61}[a-z0-9]$"
  KnowledgeBaseId:
    Type: String
    Default: ""
    AllowedPattern: "^$|^[A-Za-z0-9]{1,100}$"
  KnowledgeBaseArn:
    Type: String
    Default: ""
    AllowedPattern: "^$|^arn:[^:]+:bedrock:[^:]+:[0-9]{12}:knowledge-base/[A-Za-z0-9]+$"
  GuardrailIdentifier:
    Type: String
    Default: ""
    MaxLength: 256
  GuardrailVersion:
    Type: String
    Default: ""
    MaxLength: 32
  GuardrailArn:
    Type: String
    Default: ""
    AllowedPattern: "^$|^arn:[^:]+:bedrock:[^:]+:[0-9]{12}:guardrail/[A-Za-z0-9]+$"
  ResolverModelArn:
    Type: String
    Default: ""
    AllowedPattern: "^$|^arn:[^*?]+$"
  WriterModelArn:
    Type: String
    Default: ""
    AllowedPattern: "^$|^arn:[^*?]+$"
  ResolverFoundationModelArn:
    Type: String
    Default: ""
    AllowedPattern: "^$|^arn:[^:*?]+:bedrock:(?:[^:*?]+|\\*)::foundation-model/[A-Za-z0-9._:-]+$"
  WriterFoundationModelArn:
    Type: String
    Default: ""
    AllowedPattern: "^$|^arn:[^:*?]+:bedrock:(?:[^:*?]+|\\*)::foundation-model/[A-Za-z0-9._:-]+$"

Conditions:
  HasSearchDocuments: !Equals [!Ref EnableSearchDocuments, "true"]
  HasAdditionalGatewayClient: !Not [!Equals [!Ref GatewayJwtAdditionalClientId, ""]]
  HasSecondIDPMatter: !Not
    - !Equals
      - !Ref IDPReviewMatterIds
      - !Select [0, !Split [",", !Ref IDPReviewMatterIds]]
  HasIDPGatewayConfiguration: !And
    - !Not [!Equals [!Ref GatewayJwtIDPClientId, ""]]
    - !Not [!Equals [!Ref IDPReviewTenantId, ""]]
    - !Not [!Equals [!Ref IDPReviewMatterIds, ""]]
    - !Not [!Equals [!Ref IDPSourceBucketName, ""]]

  HasIDPMetadataStorage: !And
    - !Not [!Equals [!Ref IDPReviewTenantId, ""]]
    - !Not [!Equals [!Ref IDPReviewMatterIds, ""]]
    - !Not [!Equals [!Ref IDPSourceBucketName, ""]]
    - !Not [!Equals [!Ref IDPArtifactBucketName, ""]]

Resources:
  MetadataMcpLogGroup:
    Type: AWS::Logs::LogGroup
    DeletionPolicy: Delete
    UpdateReplacePolicy: Delete
    Properties:
      LogGroupName: /aws/lambda/LegalDeskMetadataMcpPhase08
      RetentionInDays: 14

  MetadataMcpExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      Description: Least-privilege role for metadata-only MCP Lambda
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: LegalDeskMetadataMcpPhase08
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - dynamodb:GetItem
                  - dynamodb:Query
                Resource: !Ref ExistingMetadataTableArn
              - !If
                - HasIDPMetadataStorage
                - Effect: Allow
                  Action: s3:GetObject
                  Resource:
                    - !Sub
                      - "${BucketArn}/tenants/${TenantId}/matters/${MatterId}/documents/*/original.pdf"
                      - BucketArn: !Sub "arn:${AWS::Partition}:s3:::${IDPSourceBucketName}"
                        TenantId: !Ref IDPReviewTenantId
                        MatterId: !Select [0, !Split [",", !Ref IDPReviewMatterIds]]
                    - !Sub
                      - "${BucketArn}/tenants/${TenantId}/matters/${MatterId}/documents/*/original.txt"
                      - BucketArn: !Sub "arn:${AWS::Partition}:s3:::${IDPSourceBucketName}"
                        TenantId: !Ref IDPReviewTenantId
                        MatterId: !Select [0, !Split [",", !Ref IDPReviewMatterIds]]
                    - !Sub
                      - "${BucketArn}/idp-artifacts/tenant=${TenantId}/matter=${MatterId}/document=*/run=*/pages-*"
                      - BucketArn: !Sub "arn:${AWS::Partition}:s3:::${IDPArtifactBucketName}"
                        TenantId: !Ref IDPReviewTenantId
                        MatterId: !Select [0, !Split [",", !Ref IDPReviewMatterIds]]
                    - !If
                      - HasSecondIDPMatter
                      - !Sub
                        - "${BucketArn}/tenants/${TenantId}/matters/${MatterId}/documents/*/original.pdf"
                        - BucketArn: !Sub "arn:${AWS::Partition}:s3:::${IDPSourceBucketName}"
                          TenantId: !Ref IDPReviewTenantId
                          MatterId: !Select [1, !Split [",", !Ref IDPReviewMatterIds]]
                      - !Ref AWS::NoValue
                    - !If
                      - HasSecondIDPMatter
                      - !Sub
                        - "${BucketArn}/tenants/${TenantId}/matters/${MatterId}/documents/*/original.txt"
                        - BucketArn: !Sub "arn:${AWS::Partition}:s3:::${IDPSourceBucketName}"
                          TenantId: !Ref IDPReviewTenantId
                          MatterId: !Select [1, !Split [",", !Ref IDPReviewMatterIds]]
                      - !Ref AWS::NoValue
                    - !If
                      - HasSecondIDPMatter
                      - !Sub
                        - "${BucketArn}/idp-artifacts/tenant=${TenantId}/matter=${MatterId}/document=*/run=*/pages-*"
                        - BucketArn: !Sub "arn:${AWS::Partition}:s3:::${IDPArtifactBucketName}"
                          TenantId: !Ref IDPReviewTenantId
                          MatterId: !Select [1, !Split [",", !Ref IDPReviewMatterIds]]
                      - !Ref AWS::NoValue
                - !Ref AWS::NoValue
              - Effect: Allow
                Action:
                  - logs:CreateLogStream
                  - logs:PutLogEvents
                Resource: !Sub ${MetadataMcpLogGroup.Arn}:*

  GatewayRequestInterceptorLogGroup:
    Type: AWS::Logs::LogGroup
    DeletionPolicy: Delete
    UpdateReplacePolicy: Delete
    Properties:
      LogGroupName: /aws/lambda/LegalDeskGatewayRequestInterceptorPhase08
      RetentionInDays: 14

  GatewayRequestInterceptorRole:
    Type: AWS::IAM::Role
    Properties:
      Description: Least-privilege role for Gateway request authorization interceptor
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: LegalDeskGatewayRequestInterceptorPhase08
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action: dynamodb:GetItem
                Resource: !Ref ExistingMetadataTableArn
              - Effect: Allow
                Action: dynamodb:PutItem
                Resource: !Ref ExistingMetadataTableArn
                Condition:
                  ForAllValues:StringLike:
                    dynamodb:LeadingKeys:
                      - GATEWAY#GRANT#*
                      - GATEWAY#IDP-REVIEW#*
                      - GATEWAY#EXPIRY#*
              - !If
                - HasIDPGatewayConfiguration
                - Effect: Allow
                  Action: s3:GetObject
                  Resource:
                    - !Sub
                      - "${BucketArn}/tenants/${TenantId}/matters/${MatterId}/documents/*/original.pdf"
                      - BucketArn: !Sub "arn:${AWS::Partition}:s3:::${IDPSourceBucketName}"
                        TenantId: !Ref IDPReviewTenantId
                        MatterId: !Select [0, !Split [",", !Ref IDPReviewMatterIds]]
                    - !Sub
                      - "${BucketArn}/tenants/${TenantId}/matters/${MatterId}/documents/*/original.txt"
                      - BucketArn: !Sub "arn:${AWS::Partition}:s3:::${IDPSourceBucketName}"
                        TenantId: !Ref IDPReviewTenantId
                        MatterId: !Select [0, !Split [",", !Ref IDPReviewMatterIds]]
                    - !If
                      - HasSecondIDPMatter
                      - !Sub
                        - "${BucketArn}/tenants/${TenantId}/matters/${MatterId}/documents/*/original.pdf"
                        - BucketArn: !Sub "arn:${AWS::Partition}:s3:::${IDPSourceBucketName}"
                          TenantId: !Ref IDPReviewTenantId
                          MatterId: !Select [1, !Split [",", !Ref IDPReviewMatterIds]]
                      - !Ref AWS::NoValue
                    - !If
                      - HasSecondIDPMatter
                      - !Sub
                        - "${BucketArn}/tenants/${TenantId}/matters/${MatterId}/documents/*/original.txt"
                        - BucketArn: !Sub "arn:${AWS::Partition}:s3:::${IDPSourceBucketName}"
                          TenantId: !Ref IDPReviewTenantId
                          MatterId: !Select [1, !Split [",", !Ref IDPReviewMatterIds]]
                      - !Ref AWS::NoValue
                - !Ref AWS::NoValue
              - Effect: Allow
                Action:
                  - logs:CreateLogStream
                  - logs:PutLogEvents
                Resource: !Sub ${GatewayRequestInterceptorLogGroup.Arn}:*

  GatewayRequestInterceptorFunction:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: LegalDeskGatewayRequestInterceptorPhase08
      Runtime: python3.12
      Handler: legaldesk.gateway_interceptor.gateway_request_interceptor
      Role: !GetAtt GatewayRequestInterceptorRole.Arn
      Code:
        S3Bucket: !Ref InterceptorCodeBucket
        S3Key: !Ref InterceptorCodeKey
        S3ObjectVersion: !Ref InterceptorCodeVersion
      MemorySize: 512
      Timeout: 10
      Environment:
        Variables:
          AWS_MAX_ATTEMPTS: "1"
          AWS_RETRY_MODE: standard
          REVIEW_TASK_TABLE_NAME: !Ref ExistingMetadataTableName
          IDP_TABLE_NAME: !Ref ExistingMetadataTableName
          LEGALDESK_SOURCE_BUCKET: !Ref IDPSourceBucketName
          LEGALDESK_IDP_REVIEW_TENANT_ID: !Ref IDPReviewTenantId
          LEGALDESK_IDP_REVIEW_MATTER_IDS: !Ref IDPReviewMatterIds
          LEGALDESK_IDP_M2M_CLIENT_ID: !Ref GatewayJwtIDPClientId
          LEGALDESK_IDP_REVIEW_SCOPE: !Ref GatewayJwtIDPScope
          INTERCEPTOR_SCHEMA_VERSION: "1"

  MetadataMcpFunction:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: LegalDeskMetadataMcpPhase08
      Runtime: python3.12
      Handler: legaldesk.mcp_server.mcp_lambda_handler
      Role: !GetAtt MetadataMcpExecutionRole.Arn
      Code:
        S3Bucket: !Ref MetadataMcpCodeBucket
        S3Key: !Ref MetadataMcpCodeKey
        S3ObjectVersion: !Ref MetadataMcpCodeVersion
      MemorySize: 512
      # get_extracted_fields projects up to 20 documents per call (Phase 15).
      Timeout: 20
      Environment:
        Variables:
          AWS_MAX_ATTEMPTS: "1"
          AWS_RETRY_MODE: standard
          DOCUMENT_METADATA_TABLE_NAME: !Ref ExistingMetadataTableName
          IDP_TABLE_NAME: !Ref ExistingMetadataTableName
          LEGALDESK_SOURCE_BUCKET: !Ref IDPSourceBucketName
          LEGALDESK_IDP_ARTIFACT_BUCKET: !Ref IDPArtifactBucketName
          MCP_SCHEMA_VERSION: "1"

  MetadataMcpFunctionUrl:
    Type: AWS::Lambda::Url
    Properties:
      AuthType: AWS_IAM
      TargetFunctionArn: !Ref MetadataMcpFunction

  GatewayExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      Description: Least-privilege AgentCore Gateway role for Phase 08 targets
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: bedrock-agentcore.amazonaws.com
            Action: sts:AssumeRole
            Condition:
              StringEquals:
                aws:SourceAccount: !Ref AWS::AccountId
              ArnLike:
                aws:SourceArn: !Sub arn:${AWS::Partition}:bedrock-agentcore:${AWS::Region}:${AWS::AccountId}:gateway/*
      Policies:
        - PolicyName: LegalDeskGatewayTargetsPhase08
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action: lambda:InvokeFunction
                Resource: !Ref ReviewTaskFunctionArn
              - Effect: Allow
                Action: lambda:InvokeFunctionUrl
                Resource: !GetAtt MetadataMcpFunction.Arn
              - Effect: Allow
                Action: lambda:InvokeFunction
                Resource: !GetAtt MetadataMcpFunction.Arn
                Condition:
                  Bool:
                    lambda:InvokedViaFunctionUrl: "true"
              - Effect: Allow
                Action: lambda:InvokeFunction
                Resource: !GetAtt GatewayRequestInterceptorFunction.Arn
              - !If
                - HasSearchDocuments
                - Effect: Allow
                  Action: lambda:InvokeFunction
                  Resource: !GetAtt SearchDocumentsFunction.Arn
                - !Ref AWS::NoValue
              # AgentCore requires this on a custom Gateway service role when
              # GATEWAY_IAM_ROLE outbound authorization is used. Referencing
              # LegalDeskGateway here would create a role/Gateway cycle, so
              # scope the ARN to the fixed Gateway name plus generated suffix.
              - Effect: Allow
                Action: bedrock-agentcore:InvokeGateway
                Resource: !Sub arn:${AWS::Partition}:bedrock-agentcore:${AWS::Region}:${AWS::AccountId}:gateway/legaldeskgatewayphase08-*

  LegalDeskGateway:
    Type: AWS::BedrockAgentCore::Gateway
    Properties:
      Name: LegalDeskGatewayPhase08
      Description: Private JWT-authorized LegalDesk tool gateway
      AuthorizerType: CUSTOM_JWT
      AuthorizerConfiguration:
        CustomJWTAuthorizer:
          DiscoveryUrl: !Ref GatewayJwtDiscoveryUrl
          AllowedClients: !If
            - HasIDPGatewayConfiguration
            - !If
              - HasAdditionalGatewayClient
              - - !Ref GatewayJwtClientId
                - !Ref GatewayJwtAdditionalClientId
                - !Ref GatewayJwtIDPClientId
              - - !Ref GatewayJwtClientId
                - !Ref GatewayJwtIDPClientId
            - !If
              - HasAdditionalGatewayClient
              - - !Ref GatewayJwtClientId
                - !Ref GatewayJwtAdditionalClientId
              - - !Ref GatewayJwtClientId
          AllowedScopes:
            - !Ref GatewayJwtScope
            - !If [HasIDPGatewayConfiguration, !Ref GatewayJwtIDPScope, !Ref AWS::NoValue]
      ProtocolType: MCP
      RoleArn: !GetAtt GatewayExecutionRole.Arn
      InterceptorConfigurations:
        - InterceptionPoints:
            - REQUEST
          InputConfiguration:
            PassRequestHeaders: true
          Interceptor:
            Lambda:
              Arn: !GetAtt GatewayRequestInterceptorFunction.Arn
      Tags:
        Project: LegalDesk
        Phase: "08"

  ReviewTaskGatewayTarget:
    Type: AWS::BedrockAgentCore::GatewayTarget
    Properties:
      GatewayIdentifier: !Ref LegalDeskGateway
      Name: review-task-lambda
      Description: Human review task tool
      CredentialProviderConfigurations:
        - CredentialProviderType: GATEWAY_IAM_ROLE
      TargetConfiguration:
        Mcp:
          Lambda:
            LambdaArn: !Ref ReviewTaskFunctionArn
            ToolSchema:
              InlinePayload:
                - Name: create_review_task
                  Description: >-
                    Create an OPEN review task. Human callers provide the
                    accepted-answer fields; the dedicated IDP machine variant
                    provides only matterId and invocationId.
                  InputSchema:
                    Type: object
                    Required:
                      - matterId
                    Properties:
                      reasonCode:
                        Type: string
                        Description: "Allowed values are insufficient_evidence, ambiguous_evidence, material_legal_judgment, user_requested_review, or safety_escalation; the Lambda validates them."
                      note:
                        Type: string
                        Description: "Optional bounded request note."
                      dueAt:
                        Type: string
                        Description: "Target date in YYYY-MM-DD form."
                      snapshot:
                        Type: object
                        Description: "Server-derived accepted answer snapshot."
                      matterId:
                        Type: string
                        Description: "Matter containing the review request."
                      invocationId:
                        Type: string
                        Description: "Reserved IDP machine invocation; accepted only with the dedicated client and scope."
                      _legaldeskGrantId:
                        Type: string
                        Description: Reserved server-injected opaque authorization grant; client values are rejected.
                  OutputSchema:
                    Type: object
                    Required:
                      - reviewTaskId
                      - status
                    Properties:
                      reviewTaskId:
                        Type: string
                      status:
                        Type: string
                - Name: list_review_tasks
                  Description: List review tasks for the authorized matter.
                  InputSchema:
                    Type: object
                    Required:
                      - matterId
                    Properties:
                      matterId:
                        Type: string
                      limit:
                        Type: integer
                      _legaldeskGrantId:
                        Type: string
                  OutputSchema:
                    Type: object
                - Name: get_review_task
                  Description: Get one review task and its bounded accepted-answer snapshot.
                  InputSchema:
                    Type: object
                    Required:
                      - matterId
                      - reviewTaskId
                    Properties:
                      matterId:
                        Type: string
                      reviewTaskId:
                        Type: string
                      _legaldeskGrantId:
                        Type: string
                - Name: update_review_task
                  Description: Move a review task through an allowed lifecycle transition.
                  InputSchema:
                    Type: object
                    Required:
                      - matterId
                      - reviewTaskId
                      - status
                    Properties:
                      matterId:
                        Type: string
                      reviewTaskId:
                        Type: string
                      status:
                        Type: string
                        Description: "Allowed lifecycle values are in_review and closed."
                      resolutionNote:
                        Type: string
                      _legaldeskGrantId:
                        Type: string
                      idpDecision:
                        Type: object
                        Description: "Optional human IDP field decision; the target derives actor, origin, presence, acceptance and audit metadata."
                        Required:
                          - fieldName
                          - action
                          - reason
                          - evidence
                        Properties:
                          fieldName:
                            Type: string
                          action:
                            Type: string
                            Description: "One of APPROVE, CORRECT, or REJECT; the target validates the bounded action set."
                          reason:
                            Type: string
                          proposedValueJson:
                            Type: string
                            Description: "Internal Gateway transport for the raw replacement value on CORRECT; the target strictly parses and validates it."
                          evidence:
                            Type: array
                            Items:
                              Type: object
                              Required:
                                - page
                                - quote
                                - contentSha256
                              Properties:
                                page:
                                  Type: integer
                                quote:
                                  Type: string
                                contentSha256:
                                  Type: string
                                start:
                                  Type: integer
                                end:
                                  Type: integer

  MetadataMcpGatewayTarget:
    Type: AWS::BedrockAgentCore::GatewayTarget
    Properties:
      GatewayIdentifier: !Ref LegalDeskGateway
      Name: metadata-mcp
      Description: Read-only document metadata MCP server (MCP 2025-03-26)
      CredentialProviderConfigurations:
        - CredentialProviderType: GATEWAY_IAM_ROLE
          CredentialProvider:
            IamCredentialProvider:
              Service: lambda
              Region: !Ref AWS::Region
      MetadataConfiguration:
        AllowedRequestHeaders:
          - x-legaldesk-grant-id
          - x-legaldesk-verified-subject
          - x-legaldesk-requested-matter-id
          - x-legaldesk-correlation-id
      TargetConfiguration:
        Mcp:
          McpServer:
            Endpoint: !GetAtt MetadataMcpFunctionUrl.FunctionUrl
            ListingMode: DYNAMIC

  SearchDocumentsLogGroup:
    Type: AWS::Logs::LogGroup
    Condition: HasSearchDocuments
    DeletionPolicy: Delete
    UpdateReplacePolicy: Delete
    Properties:
      LogGroupName: /aws/lambda/LegalDeskSearchDocumentsPhase15
      RetentionInDays: 14

  SearchDocumentsExecutionRole:
    Type: AWS::IAM::Role
    Condition: HasSearchDocuments
    Properties:
      Description: Least-privilege role for the grounded search-documents Lambda target
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: LegalDeskSearchDocumentsPhase15
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              # Grant lookup, bilateral user/matter authorization and the
              # document record check. Read-only: this Lambda writes nothing.
              - Sid: ReadAuthorizationGrantsAndDocumentRecords
                Effect: Allow
                Action: dynamodb:GetItem
                Resource: !Ref ExistingMetadataTableArn
              - Sid: HeadAuthorizedSourceObjects
                Effect: Allow
                Action: s3:GetObject
                Resource:
                  - !Sub "${SourceBucketArn}/tenants/${SearchTenantId}/matters/*/documents/*/original.pdf"
                  - !Sub "${SourceBucketArn}/tenants/${SearchTenantId}/matters/*/documents/*/original.txt"
              - Sid: RetrieveFromTheKnowledgeBase
                Effect: Allow
                Action: bedrock:Retrieve
                Resource: !Ref KnowledgeBaseArn
              - Sid: ApplyTheVersionedGuardrail
                Effect: Allow
                Action: bedrock:ApplyGuardrail
                Resource: !Ref GuardrailArn
              - Sid: InvokeTheApprovedResolverAndWriterModels
                Effect: Allow
                Action: bedrock:InvokeModel
                Resource:
                  - !Ref ResolverModelArn
                  - !Ref WriterModelArn
                  - !Ref ResolverFoundationModelArn
                  - !Ref WriterFoundationModelArn
              - Effect: Allow
                Action:
                  - logs:CreateLogStream
                  - logs:PutLogEvents
                Resource: !Sub ${SearchDocumentsLogGroup.Arn}:*

  SearchDocumentsFunction:
    Type: AWS::Lambda::Function
    Condition: HasSearchDocuments
    DependsOn: SearchDocumentsLogGroup
    Properties:
      FunctionName: LegalDeskSearchDocumentsPhase15
      Runtime: python3.12
      Handler: legaldesk.search_documents_lambda.search_documents_gateway_handler
      Role: !GetAtt SearchDocumentsExecutionRole.Arn
      Code:
        S3Bucket: !Ref SearchDocumentsCodeBucket
        S3Key: !Ref SearchDocumentsCodeKey
        S3ObjectVersion: !Ref SearchDocumentsCodeVersion
      MemorySize: 1024
      # ADR-021 D4: 25 s budget per tool call, no SDK retries.
      Timeout: 25
      Environment:
        Variables:
          AWS_MAX_ATTEMPTS: "1"
          AWS_RETRY_MODE: standard
          DOCUMENT_METADATA_TABLE_NAME: !Ref ExistingMetadataTableName
          LEGALDESK_SOURCE_BUCKET: !Select [5, !Split [":", !Ref SourceBucketArn]]
          LEGALDESK_KNOWLEDGE_BASE_ID: !Ref KnowledgeBaseId
          LEGALDESK_GUARDRAIL_ID: !Ref GuardrailIdentifier
          LEGALDESK_GUARDRAIL_VERSION: !Ref GuardrailVersion
          LEGALDESK_RESOLVER_MODEL_ID: !Ref ResolverModelArn
          LEGALDESK_WRITER_MODEL_ID: !Ref WriterModelArn
          LEGALDESK_SYSTEM_PROMPT_PATH: /var/task/prompts/legaldesk-system.md

  SearchDocumentsGatewayTarget:
    Type: AWS::BedrockAgentCore::GatewayTarget
    Condition: HasSearchDocuments
    Properties:
      GatewayIdentifier: !Ref LegalDeskGateway
      Name: search-documents
      Description: Read-only grounded search over the matter's documents (Retrieve, resolver, writer, Guardrail, citations)
      CredentialProviderConfigurations:
        - CredentialProviderType: GATEWAY_IAM_ROLE
      TargetConfiguration:
        Mcp:
          Lambda:
            LambdaArn: !GetAtt SearchDocumentsFunction.Arn
            ToolSchema:
              InlinePayload:
                - Name: search_documents
                  Description: >-
                    Answer a question about what the documents of the current
                    matter say, with citations. Returns answer, evidenceStatus,
                    operationStatus and citations. Use it for legal text.
                  InputSchema:
                    Type: object
                    Required:
                      - matterId
                      - question
                    Properties:
                      matterId:
                        Type: string
                        Description: "Matter selector required by the Gateway; the server ignores it for authorization."
                      question:
                        Type: string
                        Description: "Question about what the matter's documents say."
                      _legaldeskGrantId:
                        Type: string
                        Description: Reserved server-injected opaque authorization grant; client values are rejected.
                  OutputSchema:
                    Type: object

Outputs:
  GatewayIdentifier:
    Value: !Ref LegalDeskGateway
  GatewayArn:
    Value: !GetAtt LegalDeskGateway.GatewayArn
  GatewayUrl:
    Value: !GetAtt LegalDeskGateway.GatewayUrl
  MetadataMcpEndpoint:
    Value: !GetAtt MetadataMcpFunctionUrl.FunctionUrl
  SearchDocumentsFunctionArn:
    Condition: HasSearchDocuments
    Value: !GetAtt SearchDocumentsFunction.Arn
