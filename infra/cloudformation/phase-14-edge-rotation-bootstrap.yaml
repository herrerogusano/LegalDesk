AWSTemplateFormatVersion: "2010-09-09"
Description: >-
  Temporary stack-scoped CloudFormation service role for one reviewed Phase 14
  Public Edge parameter-only update (TrustedEdgeSecret rotation and
  QuotaGatewayPerMonth). It can only update the configuration of the existing
  application Lambda and the existing CloudFront distribution. It cannot change
  Lambda code, any IAM policy, S3, or Gateway. Its only API Gateway scope is
  reading and patching the one existing integration so CloudFormation can
  re-evaluate its Lambda URI dependency. It may describe log group names in
  eu-west-1 only. Delete this stack after the update is verified.

Parameters:
  ExistingApplicationRoleArn:
    Type: String
    AllowedPattern: "^arn:aws:iam::344774635844:role/LegalDeskPhase14PublicEdge-ApplicationExecutionRole-[A-Za-z0-9]+$"
    Description: Exact existing Public Edge application execution role ARN
  ApplicationFunctionArn:
    Type: String
    AllowedPattern: "^arn:aws:lambda:eu-west-1:344774635844:function:LegalDeskPhase14PublicEdge-application$"
    Description: Exact existing Public Edge application function ARN
  CloudFrontDistributionArn:
    Type: String
    AllowedPattern: "^arn:aws:cloudfront::344774635844:distribution/[A-Z0-9]+$"
    Description: Exact existing Public Edge distribution ARN
  PublicApiIntegrationArn:
    Type: String
    AllowedPattern: "^arn:aws:apigateway:eu-west-1::/apis/k7z9nuofg4/integrations/gs2d6w4$"
    Description: Exact existing API integration dependency; no other API resource is in scope
  OriginAccessControlArn:
    Type: String
    AllowedPattern: "^arn:aws:cloudfront::344774635844:origin-access-control/[A-Z0-9]+$"
    Description: Exact existing frontend origin access control (read-only dependency)
  ResponseHeadersPolicyArn:
    Type: String
    AllowedPattern: "^arn:aws:cloudfront::344774635844:response-headers-policy/[a-f0-9-]+$"
    Description: Exact existing edge response headers policy (read-only dependency)

Resources:
  EdgeRotationCloudFormationRole:
    Type: AWS::IAM::Role
    DeletionPolicy: Delete
    UpdateReplacePolicy: Delete
    Properties:
      Description: Temporary least-privilege service role for one Public Edge secret-rotation update
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: CloudFormationOnly
            Effect: Allow
            Principal:
              Service: cloudformation.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: LegalDeskPhase14EdgeSecretRotation
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Sid: ReadExistingApplicationRole
                Effect: Allow
                Action:
                  - iam:GetRole
                  - iam:ListRolePolicies
                  - iam:ListAttachedRolePolicies
                  - iam:GetRolePolicy
                Resource: !Ref ExistingApplicationRoleArn
              - Sid: UpdateConfigurationOfOnlyExistingApplicationFunction
                Effect: Allow
                Action:
                  - lambda:GetFunction
                  - lambda:GetFunctionConfiguration
                  - lambda:ListTags
                  - lambda:UpdateFunctionConfiguration
                Resource: !Ref ApplicationFunctionArn
              - Sid: PassOnlyExistingApplicationRoleToLambda
                Effect: Allow
                Action: iam:PassRole
                Resource: !Ref ExistingApplicationRoleArn
                Condition:
                  StringEquals:
                    iam:PassedToService: lambda.amazonaws.com
              - Sid: UpdateOnlyExistingDistribution
                Effect: Allow
                Action:
                  - cloudfront:GetDistribution
                  - cloudfront:GetDistributionConfig
                  - cloudfront:ListTagsForResource
                  - cloudfront:UpdateDistribution
                Resource: !Ref CloudFrontDistributionArn
              - Sid: ReadOnlyDistributionDependencies
                Effect: Allow
                # CloudFormation resolves these GetAtt/Ref dependencies while
                # updating the distribution; read-only, exact resources.
                Action:
                  - cloudfront:GetOriginAccessControl
                  - cloudfront:GetResponseHeadersPolicy
                Resource:
                  - !Ref OriginAccessControlArn
                  - !Ref ResponseHeadersPolicyArn
              - Sid: ReadAndPatchOnlyExistingApiIntegration
                Effect: Allow
                Action:
                  - apigateway:GET
                  - apigateway:PATCH
                Resource: !Ref PublicApiIntegrationArn
              - Sid: DescribeRegionalLogGroupMetadataOnly
                Effect: Allow
                Action: logs:DescribeLogGroups
                Resource: "*"
                Condition:
                  StringEquals:
                    aws:RequestedRegion: eu-west-1

Outputs:
  EdgeRotationCloudFormationRoleArn:
    Value: !GetAtt EdgeRotationCloudFormationRole.Arn
