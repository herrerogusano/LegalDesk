AWSTemplateFormatVersion: "2010-09-09"
Description: LegalDesk Phase 02 private document storage and metadata table

Parameters:
  ApplicationOrigin:
    Type: String
    Default: http://localhost:8000
    AllowedPattern: '^https?://[A-Za-z0-9.-]+(:[0-9]{1,5})?$'
    Description: Exact browser application origin allowed to PUT presigned uploads

Resources:
  DocumentBucket:
    Type: AWS::S3::Bucket
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      CorsConfiguration:
        CorsRules:
          - AllowedOrigins:
              - !Ref ApplicationOrigin
            AllowedMethods:
              - PUT
            AllowedHeaders:
              - Content-Length
              - Content-Type
              - x-amz-meta-tenant-id
              - x-amz-meta-matter-id
              - x-amz-meta-document-id
              - x-amz-server-side-encryption
            MaxAge: 300
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      LifecycleConfiguration:
        Rules:
          - Id: ExpireQuarantineUploads
            Prefix: quarantine/
            Status: Enabled
            ExpirationInDays: 1
          - Id: ExpireFictionalOriginals
            Prefix: tenants/
            Status: Enabled
            ExpirationInDays: 30
      Tags:
        - Key: Project
          Value: LegalDesk
        - Key: Phase
          Value: "02"

  DocumentBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref DocumentBucket
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: DenyInsecureTransport
            Effect: Deny
            Principal: "*"
            Action: "s3:*"
            Resource:
              - !GetAtt DocumentBucket.Arn
              - !Sub "${DocumentBucket.Arn}/*"
            Condition:
              Bool:
                aws:SecureTransport: "false"

  DocumentMetadataTable:
    Type: AWS::DynamoDB::Table
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      BillingMode: PAY_PER_REQUEST
      SSESpecification:
        SSEEnabled: true
      AttributeDefinitions:
        - AttributeName: pk
          AttributeType: S
        - AttributeName: sk
          AttributeType: S
      KeySchema:
        - AttributeName: pk
          KeyType: HASH
        - AttributeName: sk
          KeyType: RANGE
      TimeToLiveSpecification:
        AttributeName: ttl
        Enabled: true
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: true
      Tags:
        - Key: Project
          Value: LegalDesk
        - Key: Phase
          Value: "02"

  DocumentPipelineRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: LegalDeskDocumentPipelinePhase02
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: LegalDeskDocumentPipelinePhase02
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Sid: ManageSupportedOriginalObjects
                Effect: Allow
                Action:
                  - s3:PutObject
                  - s3:GetObject
                  - s3:DeleteObject
                Resource:
                  - !Sub "${DocumentBucket.Arn}/tenants/*/matters/*/documents/*/original.txt"
                  - !Sub "${DocumentBucket.Arn}/tenants/*/matters/*/documents/*/original.pdf"
              - Sid: WriteBedrockMetadataSidecars
                Effect: Allow
                Action: s3:PutObject
                Resource:
                  - !Sub "${DocumentBucket.Arn}/tenants/*/matters/*/documents/*/original.txt.metadata.json"
                  - !Sub "${DocumentBucket.Arn}/tenants/*/matters/*/documents/*/original.pdf.metadata.json"
              - Sid: WriteAndListMetadata
                Effect: Allow
                Action:
                  - dynamodb:PutItem
                  - dynamodb:UpdateItem
                  - dynamodb:GetItem
                  - dynamodb:Query
                Resource: !GetAtt DocumentMetadataTable.Arn
Outputs:
  DocumentBucketName:
    Value: !Ref DocumentBucket
  DocumentBucketArn:
    Value: !GetAtt DocumentBucket.Arn
  DocumentMetadataTableName:
    Value: !Ref DocumentMetadataTable
  DocumentMetadataTableArn:
    Value: !GetAtt DocumentMetadataTable.Arn
  DocumentPipelineRoleArn:
    Value: !GetAtt DocumentPipelineRole.Arn
