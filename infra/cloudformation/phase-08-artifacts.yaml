AWSTemplateFormatVersion: "2010-09-09"
Description: LegalDesk Phase 08 private versioned code-artifact bucket

Resources:
  LegalDeskPhase08ArtifactBucket:
    Type: AWS::S3::Bucket
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      VersioningConfiguration:
        Status: Enabled
      LifecycleConfiguration:
        Rules:
          - Id: ExpireNoncurrentArtifactVersions
            Status: Enabled
            NoncurrentVersionExpiration:
              NoncurrentDays: 30
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      Tags:
        - Key: Project
          Value: LegalDesk
        - Key: Phase
          Value: "08"

  LegalDeskPhase08ArtifactBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref LegalDeskPhase08ArtifactBucket
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: DenyInsecureTransport
            Effect: Deny
            Principal: "*"
            Action: "s3:*"
            Resource:
              - !GetAtt LegalDeskPhase08ArtifactBucket.Arn
              - !Sub ${LegalDeskPhase08ArtifactBucket.Arn}/*
            Condition:
              Bool:
                aws:SecureTransport: "false"

Outputs:
  ArtifactBucketName:
    Value: !Ref LegalDeskPhase08ArtifactBucket
  ArtifactBucketArn:
    Value: !GetAtt LegalDeskPhase08ArtifactBucket.Arn
