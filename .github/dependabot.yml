# Dependabot version updates: weekly, grouped, with a cap on open pull requests.
# Python (backend root and the agent adapter) and the GitHub Actions used by the workflows.
# Pull requests target the default (integration) branch. Nothing is merged automatically.
version: 2
updates:
  - package-ecosystem: "pip"
    directories:
      - "/"
      - "/agent"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "07:00"
      timezone: "Europe/Madrid"
    open-pull-requests-limit: 3
    groups:
      python-minor-patch:
        patterns: ["*"]
        update-types: ["minor", "patch"]
    commit-message:
      prefix: "chore(deps)"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "07:30"
      timezone: "Europe/Madrid"
    open-pull-requests-limit: 2
    groups:
      actions-minor-patch:
        patterns: ["*"]
        update-types: ["minor", "patch"]
    commit-message:
      prefix: "chore(deps)"
