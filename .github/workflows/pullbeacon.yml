# PullBeacon review on demand: comment "@pullbeacon review" on a pull request.
# Review only (no apply job), pinned to PullBeacon v0.2.0 by full commit SHA.
#
# Security model (see the PullBeacon SECURITY.md):
# - pull_request_target and issue_comment run the workflow from the default branch, never from the PR.
# - Nothing from the PR is checked out, installed, built or executed.
# - Only PRs from branches of this repository are handled; forks and Dependabot are skipped.
# - Commands require write access, verified through the GitHub API before any LLM call.
name: PullBeacon

on:
  pull_request_target:
    types: [opened, synchronize, reopened, ready_for_review]
  issue_comment:
    types: [created]
  workflow_dispatch:
    inputs:
      pr_number:
        description: Pull request number to review
        required: true

permissions: {}

concurrency:
  group: >-
    pullbeacon-${{ github.event_name == 'issue_comment'
    && format('comment-{0}', github.event.comment.id)
    || format('pr-{0}', github.event.pull_request.number || inputs.pr_number) }}
  cancel-in-progress: false

jobs:
  review:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'pull_request_target' &&
       github.event.pull_request.head.repo.full_name == github.repository) ||
      (github.event_name == 'issue_comment' && github.event.issue.pull_request &&
       contains(github.event.comment.body, '@pullbeacon') &&
       github.event.comment.user.type != 'Bot' &&
       contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.comment.author_association))
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: herrerogusano/pullbeacon@697502ee14835e029ba9093a8798b523c1c5cd6c # pullbeacon v0.2.0
        with:
          mode: review
          anthropic-api-key: ${{ secrets.ANTHROPIC_API_KEY }}
