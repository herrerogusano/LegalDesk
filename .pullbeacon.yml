# PullBeacon configuration (https://github.com/herrerogusano/pullbeacon).
# Read from the PR's base branch, never from the PR itself.
version: 1

# Review only on demand: comment "@pullbeacon review" on a pull request.
automatic_review: false

model:
  provider: anthropic
  name: anthropic/claude-sonnet-5-5
  temperature: 0
  timeout_seconds: 180

limits:
  # Phase PRs in this repository are usually large.
  max_changed_files: 60
  max_changed_lines: 3000
  max_context_chars: 160000
  max_file_bytes: 200000
  max_output_tokens: 4096
  # Preventive per-run estimate, not an accounting cap.
  max_estimated_cost_usd: 1.00
  max_inline_comments: 15
  max_batches: 4

policy:
  # Backend/agent Python, frontend scripts, IaC/workflows and design documents.
  include: ["**/*.py", "**/*.md", "**/*.yaml", "**/*.yml", "**/*.js", "**/*.cjs"]
  # Evaluation reports and binary/synthetic fixtures are data, not code.
  exclude: ["evals/results/**", "**/*.pdf", "**/*.json", "**/*.lock", "**/node_modules/**"]
  # Project security rules (tenant/matter isolation, authorization before retrieval).
  context_files: ["AGENTS.md"]
  # Review only: PullBeacon never commits to this repository.
  apply_enabled: false
