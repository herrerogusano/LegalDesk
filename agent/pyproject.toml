[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "legaldesk-agent"
version = "0.1.0"
description = "LegalDesk AgentCore Harness invocation adapter"
requires-python = ">=3.11"
dependencies = ["boto3>=1.42,<2"]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
